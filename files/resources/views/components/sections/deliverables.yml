title: What’s in the box
description: The bento — the first two cards run wide and carry a drawn fragment of the interface
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "What’s in the box"
    heading:
        type: text
        label: Heading
        default: "Everything the demo skipped"
    body:
        type: textarea
        label: Supporting copy
        rows: 4
        default: "The loop is the easy part. What makes an agent shippable is what happens when a tool times out, a human has to approve something, or you need to explain a decision three weeks later."
    items:
        type: repeater
        label: Cards
        description: "The first two cards render wide; the rest sit three across."
        source: collections.deliverables
        add_button_label: "Add card"
        item_label: title
        sub_fields:
            title:
                type: text
                label: Title
                default: "New deliverable"
            body:
                type: textarea
                label: Description
                rows: 3
                default: "What this document covers."
            detail:
                type: text
                label: Footnote
                description: "Optional. Shows as a small line under a hairline."
                default: ""
            bed:
                type: select
                label: Visual bed
                description: "Draws a fragment of the interface on a paper panel. Only the wide cards should carry one."
                options:
                    "": "No bed — show the icon"
                    trace: "Run trace"
                    tools: "Typed tool"
                default: ""
            icon:
                type: textarea
                label: Icon SVG
                description: "Inline SVG. Shown when the card has no visual bed."
                rows: 3
                default: ""
