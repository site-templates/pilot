        add_button_label: "Add card"
        item_label: title
        sub_fields:
            title:
                type: text
                label: Title
                default: "New deliverable"
            body:
                type: textarea
                label: Description
                rows: 3
                default: "What this document covers."
            detail:
                type: text
                label: Footnote
                description: "Optional. Shows as a small line under a hairline."
                default: ""
            icon:
                type: textarea
                label: Icon SVG
                description: "Inline SVG. Use fill='currentColor' so it follows the theme."
                rows: 3
                default: ""
