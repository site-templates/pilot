title: What you get
description: The bento of everything Pilot writes from one brief — the first two cards run wide
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "What you get"
    heading:
        type: text
        label: Heading
        default: "Seven documents, one brief"
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Every send is a complete package — the proposal a client signs, plus everything that usually gets written at 11pm the night before."
    items:
        type: repeater
        label: Cards
        description: "The first two cards render wide; the rest sit three across."
