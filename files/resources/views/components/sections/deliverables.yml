title: What you get
description: The bento of everything Pilot writes from one brief — the first two cards run wide
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "What you get"
    heading:
        type: text
        label: Heading
        default: "Seven documents, one brief"
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Every send is a complete package — the proposal a client signs, plus everything that usually gets written at 11pm the night before."
    items:
        type: repeater
        label: Cards
        description: "The first two cards render wide; the rest sit three across."
        source: collections.deliverables
        add_button_label: "Add card"
        item_label: title
        sub_fields:
            title:
                type: text
                label: Title
                default: "New deliverable"
            body:
                type: textarea
                label: Description
                rows: 3
                default: "What this document covers."
            detail:
                type: text
                label: Footnote
                description: "Optional. Shows as a small line under a hairline."
                default: ""
            bed:
                type: select
                label: Visual bed
                description: "Draws a document fragment on a tinted panel. Only the wide cards should carry one."
                options:
                    "": "No bed — show the icon"
                    proposal: "Proposal sheet"
                    scope: "Scope list"
                default: ""
            tint:
                type: select
                label: Tint
                description: "Colours the bed, or the icon square when there is no bed."
                options:
                    indigo: "Indigo"
                    violet: "Violet"
                    blush: "Blush"
                    cyan: "Cyan"
                default: "indigo"
            icon:
                type: textarea
                label: Icon SVG
                description: "Inline SVG. Shown when the card has no visual bed."
                rows: 3
                default: ""
