title: Integrations
description: A dense hairline tile grid of the models, stores, and queues Pilot plugs into
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Runs where you already run"
    heading:
        type: text
        label: Heading
        default: "A library, not a platform"
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Pilot is a dependency inside your app, not a service you operate. It speaks to the models, stores, and queues you already have."
    items:
        type: repeater
        label: Tools
        source: collections.integrations
        add_button_label: "Add tool"
        item_label: name
        sub_fields:
            name:
                type: text
                label: Name
                default: "New tool"
            category:
                type: text
                label: Category
                default: "Category"
            icon:
                type: textarea
                label: Icon SVG
                description: "Inline SVG. Use fill='currentColor' so it follows the theme."
                rows: 3
                default: ""
