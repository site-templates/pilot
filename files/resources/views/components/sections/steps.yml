title: How it works
description: A sticky heading column beside the numbered steps, threaded on a hairline rail
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "How it works"
    heading:
        type: text
        label: Heading
        default: "Fifteen lines, then it runs itself."
    body:
        type: textarea
        label: Supporting copy
        rows: 4
        default: "You already know what the agent should do. Pilot handles the parts that make it survive production — the retries, the checkpoints, the approvals, and the record of what happened."
    linkText:
        type: text
        label: Link text
        default: "Read the loop guide"
    linkHref:
        type: url
        label: Link
        default: "/guides/designing-an-agent-loop"
    items:
        type: repeater
        label: Steps
        source: collections.steps
        add_button_label: "Add step"
        item_label: title
        sub_fields:
            number:
                type: text
                label: Number
                default: "04"
            title:
                type: text
                label: Title
                default: "New step"
            body:
                type: textarea
                label: Description
                rows: 3
                default: "What happens at this step."
            meta:
                type: text
                label: Meta line
                default: "Takes about a minute"
