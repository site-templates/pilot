title: How it works
description: A sticky heading column beside the numbered steps, threaded on a hairline rail
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "How it works"
    heading:
        type: text
        label: Heading
        default: "Three minutes of work, start to sent."
    body:
        type: textarea
        label: Supporting copy
        rows: 4
        default: "You already did the hard part — you got the enquiry. Pilot handles the two hours of formatting, second-guessing, and rounding numbers that usually sit between the brief and the send button."
    linkText:
        type: text
        label: Link text
        default: "Read the pricing guide"
    linkHref:
        type: url
        label: Link
        default: "/guides/how-to-price-client-work"
    items:
        type: repeater
        label: Steps
        source: collections.steps
        add_button_label: "Add step"
        item_label: title
        sub_fields:
            number:
                type: text
                label: Number
                default: "04"
            title:
                type: text
                label: Title
                default: "New step"
            body:
                type: textarea
                label: Description
                rows: 3
                default: "What happens at this step."
            meta:
                type: text
                label: Meta line
                default: "Takes about a minute"
