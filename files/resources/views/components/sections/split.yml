title: Split with visual
description: Copy on one side, a chart drawn in markup on the other — a price ladder or a project schedule
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Cost"
    heading:
        type: text
        label: Heading
        default: "Know what a run costs before it runs"
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Agents are cheap until they are not. Pilot meters every call and attributes it to the step that made it."
    pointOne:
        type: text
        label: Point one
        default: "Per-run and per-step spend, live"
    pointTwo:
        type: text
        label: Point two
        default: "Hard budget ceilings that halt instead of overrun"
    pointThree:
        type: text
        label: Point three
        default: "Cached tool results reused across retries"
    linkText:
        type: text
        label: Link text
        default: "How Pilot meters a run"
    linkHref:
        type: url
        label: Link
        default: "/guides/designing-an-agent-loop"
    align:
        type: select
        label: Visual side
        options:
            right: "Visual on the right"
            left: "Visual on the left"
        default: "right"
    visual:
        type: select
        label: Visual style
        description: "Timeline adds a week ruler above the bars."
        options:
            packages: "Price ladder"
            timeline: "Project schedule"
        default: "packages"
    visualTitle:
        type: text
        label: Visual title
        default: "Spend by step"
    visualChip:
        type: text
        label: Visual chip
        default: "Last 24h"
    visualNote:
        type: text
        label: Visual footnote
        default: "Averaged over 3,410 runs on this workspace."
    rulerOne:
        type: text
        label: Ruler mark 1
        description: "Only shown when the visual style is Project schedule."
        default: "W1"
    rulerTwo:
        type: text
        label: Ruler mark 2
        default: "W3"
    rulerThree:
        type: text
        label: Ruler mark 3
        default: "W5"
    rulerFour:
        type: text
        label: Ruler mark 4
        default: "W7"
    rulerFive:
        type: text
        label: Ruler mark 5
        default: "W8"
    items:
        type: repeater
        label: Rows
        description: "Each row draws a bar. Start and width are percentages of the track."
        add_button_label: "Add row"
        item_label: label
        sub_fields:
            label:
                type: text
                label: Label
                default: "New row"
            value:
                type: text
                label: Value
                default: "$0"
            startPercent:
                type: number
                label: Bar start (%)
                min: 0
                max: 100
                step: 1
                default: "0"
            widthPercent:
                type: number
                label: Bar width (%)
                min: 0
                max: 100
                step: 1
                default: "50"
            featured:
                type: toggle
                label: Highlight
                default: "0"
