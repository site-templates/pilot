# The visual editor's contract for sections/hero.blade.php: each field maps
# to a prop in the component's props. Defaults fill any attribute the page
# doesn't pass. Field names are camelCase, matching the props they fill.
title: Hero
description: The opening statement and the Console — the runs queue, a live trace, and the terminal, standing on the painting
fields:
    heading:
        type: text
        label: Heading
        default: "Pilot is the runtime for agents you can actually ship."
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Define an agent in a few lines, hand it tools, and Pilot runs the loop — retries, state, human review, and a trace of every decision it made."
    ctaText:
        type: text
        label: Primary button text
        default: "Get started"
    ctaLink:
        type: url
        label: Primary button link
        default: "/pricing"
    secondaryText:
        type: text
        label: Secondary button text
        default: "Read the guides"
    secondaryLink:
        type: url
        label: Secondary button link
        default: "/guides"
    stageImage:
        type: image
        label: Stage painting
        description: "The full-bleed band the console stands on."
        default: "/images/valley.jpg"
    consoleTitle:
        type: text
        label: Window title
        default: "Pilot Console"
    runsLabel:
        type: text
        label: Queue label
        default: "Running"
    runsCount:
        type: text
        label: Queue count
        default: "4"
    runs:
        type: repeater
        label: Runs
        description: "The queue on the left and the trace on the right. Turn on Active to highlight one."
        source: collections.runs
        add_button_label: "Add run"
        item_label: label
        sub_fields:
            label:
                type: text
                label: Run name
                default: "New run"
            meta:
                type: text
                label: Status line
                default: "queued"
            active:
                type: toggle
                label: Active
                default: "0"
    activeRun:
        type: text
        label: Active run title
        default: "Backfill customer embeddings"
    promptText:
        type: textarea
        label: The prompt
        rows: 3
        default: "Backfill embeddings for every customer record created before March, then verify the index is complete."
    traceOne:
        type: text
        label: Trace line one
        default: "Read schema/customers.sql"
    traceTwo:
        type: text
        label: Trace line two
        default: "Planned 3 steps · 1 subagent"
    traceThree:
        type: text
        label: Trace line three
        default: "Thought for 6s"
    assistantText:
        type: textarea
        label: The agent's reply
        rows: 3
        default: "Batching 41,880 records at 500 per call. I will checkpoint after every batch so a failure resumes instead of restarting."
    files:
        type: repeater
        label: Files touched
        source: collections.files
        add_button_label: "Add file"
        item_label: path
        sub_fields:
            path:
                type: text
                label: Path
                default: "app/NewFile.php"
            added:
                type: text
                label: Lines added
                default: "0"
            removed:
                type: text
                label: Lines removed
                default: "0"
    outputLabel:
        type: text
        label: Right pane label
        default: "Trace"
    terminalTitle:
        type: text
        label: Terminal title
        default: "pilot run"
    terminalOne:
        type: text
        label: Terminal line one
        default: "batch 84/84  ·  41,880 embedded"
    terminalTwo:
        type: text
        label: Terminal line two
        default: "verify: index complete, 0 gaps"
    terminalThree:
        type: text
        label: Terminal line three
        default: "done in 4m 12s  ·  $1.94"
