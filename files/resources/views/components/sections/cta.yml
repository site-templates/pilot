        type: text
        label: Secondary button text
        default: "Talk to us"
    secondaryLink:
        type: url
        label: Secondary button link
        default: "mailto:hello@pilot.co"
    note:
        type: text
        label: Footnote
        default: "No card required · Cancel any time · Your templates stay yours"
