title: Page header
description: The left-aligned opening block for inner pages, over a calm mesh
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Features"
    heading:
        type: text
        label: Heading
        default: "Everything the demo skipped"
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "The loop is the easy part. Here is exactly what Pilot gives you, what it expects from your code, and what it deliberately leaves alone."
    showMeta:
        type: toggle
        label: Show the stat beside the heading
        default: "0"
    metaOne:
        type: text
        label: Stat value
        default: ""
    metaTwo:
        type: text
        label: Stat label
        default: ""
