# The chrome around a single guide. Most of these fields come from the guide's
# own entry in resources/data/collections/guides.json — edit them there, in the
# Content editor. The back link and the in-article CTA are set here.
title: Guide layout
description: Title block, sticky byline rail, and the in-article call to action
fields:
    backText:
        type: text
        label: Back link text
        default: "Guides"
    backLink:
        type: url
        label: Back link
        default: "/guides"
    ctaHeading:
        type: text
        label: CTA heading
        default: "Stop writing the loop by hand"
    ctaBody:
        type: textarea
        label: CTA copy
        rows: 3
        default: "Pilot gives you the durable loop, typed tools, and the trace — so you write the agent, not the plumbing."
    ctaText:
        type: text
        label: CTA button text
        default: "Get started"
    ctaLink:
        type: url
        label: CTA button link
        default: "/pricing"
    fieldImage:
        type: image
        label: Backdrop
        description: "The quiet light field behind this block."
        default: "/images/hero-field.jpg"
