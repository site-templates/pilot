# The visual editor's contract for components/nav.blade.php — these fields
# surface under the Layout tab. Field names are camelCase, matching the props
# they fill.
title: Navigation
description: The top bar — brand mark, links with dark dropdown menus, and the calls to action
fields:
    brand:
        type: text
        label: Brand name
        default: "Pilot"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into a dropdown. Stored in site.json."
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
    secondaryText:
        type: text
        label: Quiet link text
        default: "Talk to us"
    secondaryLink:
        type: url
        label: Quiet link
        default: "mailto:hello@pilot.dev"
    signInText:
        type: text
        label: Outlined button text
        default: "Sign in"
    signInLink:
        type: url
        label: Outlined button link
        default: "#"
    ctaText:
        type: text
        label: Solid button text
        default: "Get Pilot"
    ctaLink:
        type: url
        label: Solid button link
        default: "/pricing"
